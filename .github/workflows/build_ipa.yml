name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare folder structure and patch Swift sources
        run: |
          mkdir -p Shared iOSSenderApp BroadcastUploadExtension

          SHARED_FILE=$(find . -maxdepth 3 -name "StreamingProtocolAndTransport.swift" | head -n 1)
          SENDER_FILE=$(find . -maxdepth 3 -name "iOSSenderApp.swift" | head -n 1)
          EXT_FILE=$(find . -maxdepth 3 -name "BroadcastExtension_CaptureAndEncoder.swift" | head -n 1)

          if [ ! "$SHARED_FILE" -ef "Shared/StreamingProtocolAndTransport.swift" ]; then
            cp "$SHARED_FILE" Shared/StreamingProtocolAndTransport.swift
          fi
          if [ ! "$SENDER_FILE" -ef "iOSSenderApp/iOSSenderApp.swift" ]; then
            cp "$SENDER_FILE" iOSSenderApp/iOSSenderApp.swift
          fi
          if [ ! "$EXT_FILE" -ef "BroadcastUploadExtension/BroadcastExtension_CaptureAndEncoder.swift" ]; then
            cp "$EXT_FILE" BroadcastUploadExtension/BroadcastExtension_CaptureAndEncoder.swift
          fi

          rm -f ./StreamingProtocolAndTransport.swift ./iOSSenderApp.swift ./BroadcastExtension_CaptureAndEncoder.swift ./tvOSReceiverApp.swift ./AppEntry.swift

          # Авто-патч под компилятор Swift в Xcode 16
          python3 - << 'PYEOF'
          for path in [
              "Shared/StreamingProtocolAndTransport.swift",
              "iOSSenderApp/iOSSenderApp.swift",
              "BroadcastUploadExtension/BroadcastExtension_CaptureAndEncoder.swift",
          ]:
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()

              if path.endswith("StreamingProtocolAndTransport.swift") and "import Combine" not in text:
                  text = text.replace("import Foundation", "import Foundation\nimport Combine", 1)

              if path.endswith("iOSSenderApp.swift") and "import Combine" not in text:
                  text = text.replace("import SwiftUI", "import SwiftUI\nimport Combine\nimport UIKit", 1)

              # Заменяем Task { @MainActor in на DispatchQueue.main.async и убираем @MainActor / @inlinable
              text = text.replace("Task { @MainActor in", "DispatchQueue.main.async {")
              text = text.replace("@MainActor", "")
              text = text.replace("@inlinable", "")
              text = text.replace(
                  "let props: [CFString: Any] = [\n                    kVTEncodeFrameOptionKey_ForceKeyFrame: kCFBooleanTrue!\n                ]",
                  "let props: [NSString: AnyObject] = [\n                    kVTEncodeFrameOptionKey_ForceKeyFrame as NSString: kCFBooleanTrue\n                ]"
              )
              text = text.replace("kCFBooleanTrue!", "kCFBooleanTrue")

              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
          PYEOF

          cat << 'EOF' > iOSSenderApp/AppEntry.swift
          import SwiftUI

          @main
          struct LowLatencyScreenMirrorApp: App {
              var body: some Scene {
                  WindowGroup {
                      SenderMainView()
                  }
              }
          }
          EOF

      - name: Generate Info.plist and project.yml
        run: |
          cat << 'EOF' > iOSSenderApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ru</string>
              <key>CFBundleDisplayName</key>
              <string>LowLatency Mirror</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Для прямой передачи видеопотока экрана на ПК или ТВ по Wi-Fi.</string>
              <key>NSBonjourServices</key>
              <array>
                  <string>_llmirror._udp</string>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > BroadcastUploadExtension/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>ru</string>
              <key>CFBundleDisplayName</key>
              <string>BroadcastExtension</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>XPC!</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSExtension</key>
              <dict>
                  <key>NSExtensionPointIdentifier</key>
                  <string>com.apple.broadcast-services-upload</string>
                  <key>NSExtensionPrincipalClass</key>
                  <string>SampleHandler</string>
                  <key>RPBroadcastProcessMode</key>
                  <string>RPBroadcastProcessModeSampleBuffer</string>
              </dict>
              <key>NSLocalNetworkUsageDescription</key>
              <string>Для отправки видеопотока экрана по UDP.</string>
              <key>NSBonjourServices</key>
              <array>
                  <string>_llmirror._udp</string>
              </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > project.yml
          name: LowLatencyScreenMirror
          options:
            bundleIdPrefix: com.example.lowlatencymirror
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: "minimal"
              IPHONEOS_DEPLOYMENT_TARGET: "16.0"
              CODE_SIGN_IDENTITY: ""
              CODE_SIGNING_REQUIRED: "NO"
              CODE_SIGNING_ALLOWED: "NO"
              AD_HOC_CODE_SIGNING_ALLOWED: "YES"
              ENABLE_BITCODE: "NO"

          targets:
            LowLatencyScreenMirror:
              type: application
              platform: iOS
              sources:
                - path: Shared
                - path: iOSSenderApp
                  excludes:
                    - Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.lowlatencymirror
                  INFOPLIST_FILE: iOSSenderApp/Info.plist
              dependencies:
                - target: BroadcastExtension
                  embed: true
                  codeSign: false

            BroadcastExtension:
              type: app-extension
              platform: iOS
              sources:
                - path: Shared
                - path: BroadcastUploadExtension
                  excludes:
                    - Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.lowlatencymirror.BroadcastExtension
                  INFOPLIST_FILE: BroadcastUploadExtension/Info.plist
                  SKIP_INSTALL: "YES"
          EOF

      - name: Generate Xcode project and compile
        run: |
          rm -rf LowLatencyScreenMirror.xcodeproj build Payload LowLatencyScreenMirror.ipa
          which xcodegen || brew install xcodegen
          xcodegen generate

          set +e
          xcodebuild clean build \
            -project LowLatencyScreenMirror.xcodeproj \
            -scheme LowLatencyScreenMirror \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ДЕТАЛИ ОШИБКИ КОМПИЛЯЦИИ ==="
            grep -E "error:|fatal error:" build.log || tail -n 50 build.log
            exit $EXIT_CODE
          fi
          set -e

      - name: Ad-hoc sign and package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LowLatencyScreenMirror.app"
          if [ -d "$APP_PATH/PlugIns/BroadcastExtension.appex" ]; then
            codesign --force --sign - "$APP_PATH/PlugIns/BroadcastExtension.appex"
          fi
          codesign --force --sign - "$APP_PATH"

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qry LowLatencyScreenMirror.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowLatencyScreenMirror-IPA
          path: LowLatencyScreenMirror.ipa
