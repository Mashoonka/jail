name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compile Unsigned App
        run: |
          xcodebuild clean build \
            -project LowLatencyScreenMirror.xcodeproj \
            -scheme LowLatencyScreenMirror \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LowLatencyScreenMirror.app Payload/
          zip -r LowLatencyScreenMirror.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowLatencyScreenMirror-IPA
          path: LowLatencyScreenMirror.ipa
